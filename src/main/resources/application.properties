spring.datasource.url=jdbc:mysql://localhost:3306/StockRecommender?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 开启SQL初始化
spring.sql.init.mode=never
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:db/create_all_tables.sql

# JDBC
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# AI Chat Service Configuration
ai.chat.lmstudio.url=http://localhost:1234/v1/chat/completions
ai.chat.openrouter.url=https://openrouter.ai/api/v1/chat/completions
ai.chat.openrouter.key=YOUR_OPEN_Router_key
ai.chat.data.folder=src/main/resources/data/


# Polygon.io API Configuration
polygon.api.key=YOUR_POLYGON_API_KEY
polygon.api.baseurl=https://api.polygon.io

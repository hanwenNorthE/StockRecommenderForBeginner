# Docker profile configuration
spring.datasource.url=jdbc:mysql://mysql-db:3306/stockrecommender?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Hibernate settings for database initialization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# SQL init configuration
spring.sql.init.mode=never
spring.sql.init.platform=mysql

# Server configuration
server.port=8080

# JSP configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Knowledge base API configuration
knowledge.base.url=http://python-app:5000

# AI Chat configuration
ai.chat.lmstudio.url=http://host.docker.internal:1234/v1/chat/completions
ai.chat.data.folder=/app/src/main/resources/data/

# Keep other API keys from base properties
# Polygon.io keys and OpenRouter keys will be inherited from application.properties 